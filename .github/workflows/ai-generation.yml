name: AI Playwright Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Custom prompt (leave blank to use prompts/build-todo.txt)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Authenticate Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Feature Branch
        id: branch
        run: |
          $branch = "ai-generated/tests-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          git checkout -b $branch
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$branch"

      - name: Override Prompt (if provided)
        if: inputs.prompt != ''
        env:
          CUSTOM_PROMPT: ${{ inputs.prompt }}
        run: Set-Content -Path "prompts/build-todo.txt" -Value $env:CUSTOM_PROMPT

      - name: Run AI Generation Script
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_TOKEN }}
        run: ./scripts/run-ai-generation.ps1

      - name: Push Feature Branch
        run: git push origin "${{ steps.branch.outputs.name }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create `
            --title "AI Generated: Playwright BDD Tests" `
            --body "Auto-generated by Copilot AI agent. Prompt source: prompts/build-todo.txt" `
            --base main `
            --head "${{ steps.branch.outputs.name }}"